<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - Ceci n'est pas une page</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: radial-gradient(circle at 50% 30%, #2b1055, #0b0b1a 70%);
         color: #f5f5ff; font-family: Georgia, serif; text-align: center; overflow: hidden; }
  .card { padding: 2rem; z-index: 1; }
  h1 { font-size: clamp(5rem, 22vw, 11rem); letter-spacing: .05em;
       background: linear-gradient(90deg, #ff9a8b, #ff6a88, #ff99ac);
       -webkit-background-clip: text; background-clip: text; color: transparent; }
  p.fr { font-size: 1.6rem; font-style: italic; margin: .5rem 0 1rem; }
  p.en { opacity: .75; margin-bottom: 2rem; }
  a { color: #0b0b1a; background: #ffd166; padding: .8rem 1.6rem; border-radius: 999px;
      text-decoration: none; font-family: Arial, sans-serif; font-weight: bold; }
  a:hover { background: #ffe29a; }
  .ghost { position: absolute; font-size: 3rem; opacity: .15; animation: float 7s ease-in-out infinite; }
  .g1 { top: 12%; left: 10%; } .g2 { bottom: 15%; right: 12%; animation-delay: 2s; }
  .g3 { top: 60%; left: 20%; animation-delay: 4s; }
  @keyframes float { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-25px) rotate(8deg); } }
</style>
</head>
<body>
  <div class="ghost g1">?</div><div class="ghost g2">&lt;/&gt;</div><div class="ghost g3">404</div>
  <div class="card">
    <h1>404</h1>
    <p class="fr">Ceci n'est pas une page</p>
    <p class="en">This is not a page. The page you were looking for took a wrong turn somewhere in the server.</p>
    <a href="/">Take me home</a>
  </div>
</body>
</html>
